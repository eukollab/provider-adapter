# The buyer-and-seller example on the network, both agents in testing. Fill seller.env and buyer.env as the README
# says, then: docker compose up --build
services:
  seller:
    build: .
    command: ["uvicorn", "seller:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: seller.env
    environment:
      EKL_JOURNAL: /data/seller.db
    # The agent.json `ekl agent init` wrote: the adapter announces it at start.
    volumes: ["seller-journal:/data", "./agent.json:/app/agent.json:ro"]
    ports: ["8000:8000"]
  buyer:
    build: .
    command: ["python", "buyer.py"]
    env_file: buyer.env
    environment:
      EKL_JOURNAL: /data/buyer.db
      # The profile `ekl new agent buyer --does use` wrote: the buyer announces it before its first action.
      EKL_AGENT_FILE: /app/buyer-agent.json
    volumes: ["buyer-journal:/data", "./buyer/agent.json:/app/buyer-agent.json:ro"]
    depends_on: [seller]
volumes:
  seller-journal:
  buyer-journal:

# The buyer-and-seller example in the sandbox: two agents, each with its own sandbox credentials.
# Fill seller.env and buyer.env from the agents' Advanced tabs, then: docker compose up
services:
  seller:
    build: .
    command: ["uvicorn", "seller:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: seller.env
    environment:
      EKL_JOURNAL: /data/seller.db
    # The agent.json `ekl agent init` wrote: the adapter announces it at start.
    volumes: ["seller-journal:/data", "./agent.json:/app/agent.json:ro"]
    ports: ["8000:8000"]
  buyer:
    build: .
    command: ["python", "buyer.py"]
    env_file: buyer.env
    environment:
      EKL_JOURNAL: /data/buyer.db
    volumes: ["buyer-journal:/data"]
    depends_on: [seller]
volumes:
  seller-journal:
  buyer-journal:

# The buyer-and-seller example on the network, both agents in testing: the seller's MCP server, the connector in front
# of it (relay mode, so nothing needs a public address) and the buyer's connector (use-only mode), each connector
# running its agent's eukollab_callbacks.py. Write seller-agent/ and buyer-agent/ with ekl add as the README says,
# then: docker compose up --build
services:
  server:
    build: .
    command: ["python", "server.py"]
    environment:
      HOST: 0.0.0.0
  seller:
    build: .
    command: ["ekl-provider-connector", "--relay"]
    env_file: seller-agent/.env
    environment:
      EKL_AGENT_FILE: /agent/agent.json
      EKL_UPSTREAM_MCP_URL: http://server:8000/mcp
      EKL_JOURNAL: /data/seller.db
    volumes: ["./seller-agent:/agent", "seller-journal:/data"]
    depends_on: [server]
  buyer:
    build: .
    command: ["ekl-provider-connector", "--use-only"]
    env_file: buyer-agent/.env
    environment:
      EKL_AGENT_FILE: /agent/agent.json
      EKL_JOURNAL: /data/buyer.db
    volumes: ["./buyer-agent:/agent", "buyer-journal:/data"]
    depends_on: [seller]
volumes:
  seller-journal:
  buyer-journal:
